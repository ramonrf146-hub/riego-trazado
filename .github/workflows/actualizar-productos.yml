name: Actualizar catálogo mensual (PA-API)

on:
  schedule:
    # Día 1 de cada mes, 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions
  repository_dispatch:
    types: [actualizar-productos] # disparado por /api/cron/actualizar-productos (Vercel Cron)

permissions:
  contents: write

jobs:
  actualizar-productos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Correr script de actualización
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: npm run actualizar-productos

      - name: Commitear cambios si hay
        run: |
          git config user.name "riego-trazado-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/productos.json; then
            echo "Sin cambios en el catálogo, nada que commitear."
          else
            git add data/productos.json
            git commit -m "chore: actualizar catálogo mensual ($(date -u +%Y-%m))"
            git push
          fi
